[package]
name = "bio-site"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
futures = "0.3"
getrandom = { version = "0.2", features = ["js"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
id3 = "1.16"
js-sys = "0.3"
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "DeviceOrientationEvent",
    "Document",
    "DomRect",
    "Element",
    "File",
    "FileList",
    "HtmlAudioElement",
    "HtmlInputElement",
    "HtmlVideoElement",
    "MediaError",
    "MediaQueryList",
    "PointerEvent",
    "Url",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
